<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <!-- Boostrap and style -->
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
        <link href="{{ url_for('static', path='/style.css') }}" rel="stylesheet">

        <title>Friend Web Games 🎮: {% block title %}{% endblock %}</title>
    </head>
    <body>

        <!-- Navebar -->
        <div class="navbar bg-1 fg-2" data-bs-theme="dark">
            <div class="nav-overflow" data-bs-toggle="nav-overflow">
                <ul class="ms-4 nav nav-underline">
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" aria-current="page" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/create_room_form' %}active{% endif %}" href="/create_room_form">Create Room</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/join_room_form' %}active{% endif %}" href="/join_room_form">Join Room</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/register_form' %}active{% endif %}" href="/register_form">Register</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/login' %}active{% endif %}" href="/login_form">Login</a>
                    </li>
                </ul>
            </div>
        </div>

        {% block body %}{% endblock %}

        {% block script %}{% endblock %}
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    </body>
    
</html>
