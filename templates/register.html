{% extends "layout.html" %}

{% block title %} Register {% endblock %}

{% block body %}
<div class="container mt-6">
    <div class="row justify-content-center"> 
        <div class="col-6">
            <div class="card theme-success">
                <!-- Head of the card -->
                <div class="card-header card-primary">
                    Register
                </div>
                <div class="card-body">
                    <form action="/register" method="post">

                        <!-- Inpts fields -->
                        <div class="mb-2">
                            <label for="username" class="form-label mb-2">Username</label>
                            <input required type="text" name="username" class="form-control" id="username" placeholder="Ex: Gael346">
                        </div>

                        <div class="mb-2">
                            <label for="password" class="form-label mb-2">Password</label>
                            <input required type="password" name="password" class="form-control" id="password" placeholder="Ex: abc_123">
                        </div>

                        <div>
                            <label for="confirm_password" class="form-label mb-2">Confirm password</label>
                            <input required type="password" name="confirm_password" class="form-control" id="confirm_password" placeholder="Ex: abc_123">
                        </div>
                         
                        <button class="btn-solid theme-accent mt-4">Sumbit</button>
                    </form> 
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
