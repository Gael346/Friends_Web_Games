{% extends "layout.html" %}

{% block title %} Register {% endblock %}

{% block body %}
<div class="container mt-3">
    <div class="row justify-content-center"> 
        <div class="col-6">
            <div class="card">
                <div class="card-header card-primary">
                    Register
                </div>
                <div class="card-body">
                    <form action="/register" method="post">
                        <div class="mb-2">
                            <label for="username" class="form-label mb-2">Username</label>
                            <input type="text" name="username" class="form-control" id="username" placeholder="Ex: Gael346">
                        </div>
                        
                        <div>
                            <label for="password" class="form-label mb-2">Password</label>
                            <input type="password" name="password" class="form-control" id="password" placeholder="Ex: abc_123">
                        </div>
                         
                        <button class="btn-solid theme-accent mt-4">Sumbit</button>
                    </form> 
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
