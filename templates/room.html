{% extends "layout.html" %}

{% block title %}Room{% endblock %}

{% block body %}
<div class="ms-3 mt-5">
    <div class="row"> 
        <div class="mb-5">
            <div class="fs-5xl">{{room_name}}</div>
            <h3>Code: <span id="code" class="badge theme-accent">{{code}}</span></h3>
            <input type="text" id="username" hidden value="{{username}}">
        </div>
        <!-- Users connected field -->
        <div class="col-3 vh-100">
            <div class="card theme-success h-75">
                <h5 class="card-header">Users Connected</h5>
                <div class="card-body" id="card_users">
                    {% for user in users %}
                    <p>{{user}}</p>
                    {% endfor %}
                </div>
            </div>
        </div>
        <div class="col-9">
            <!-- Insert chat button and more -->
        </div>
    </div>
</div>
{% endblock %}


{% block script %}
<script>
    // Get the code and username
    const code = document.getElementById("code").innerHTML;
    const username = document.getElementById("username").value;
    // Create the websocket
    const ws = new WebSocket(`ws://${location.host}/ws/${code}/${username}`);

    // Function to get the info
    function connect()
    {
        ws.onmessage = function(event){

            const data = JSON.parse(event.data);
            var value = data.value;
            var type = data.type;

            if(type == "join"){
                var legend = document.getElementById("card_users")
                var p = document.createElement("p");
                p.innerHTML = value;
                legend.appendChild(p);
            }
            else if(type == "message")
            {

            }

        }    
    }

    // Function to send the info 
    function send(event){
        var input = document.getElementById("input1")
        ws.send(JSON.stringify({
            "type" : "message",
            "value" : input.value
        }));
    }
    
    connect()
</script>
{% endblock %}s
